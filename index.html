<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Personal Website</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is the home section of my website.</p>
            <img src="img/sample.jpg" alt="Sample Image">
        </section>
        <section id="about">
            <h2>About</h2>
            <p>This is the about section of my website.</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>This is the contact section of my website.</p>
            <form action="/submit" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Personal Website. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
